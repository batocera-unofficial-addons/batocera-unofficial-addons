<?xml version="1.0" encoding="UTF-8" ?>
<features>
  <emulator name="azaharplus" features="">
    <sharedFeature value="powermode" />
    <sharedFeature value="tdp" />
    <sharedFeature value="videomode" />
    <sharedFeature value="bezel" />
    <sharedFeature value="bezel_stretch" />
    <sharedFeature value="hud" />
    <sharedFeature value="hud_corner" />
    <sharedFeature value="bezel.tattoo" />
    <sharedFeature value="bezel.tattoo_corner" />
    <sharedFeature value="bezel.tattoo_file" />
    <sharedFeature value="bezel.resize_tattoo" />
    <feature name="SCREEN LAYOUT" value="azahar_screen_layout" description="Arrange the dual screen layout. Separate windows can be changed with Hotkey+R2.">
      <choice name="Top Only" value="1-false" />
      <choice name="Bottom Only" value="1-true" />
      <choice name="Large Top" value="2-false" />
      <choice name="Large Bottom" value="2-true" />
      <choice name="Left/Right" value="3-false" />
      <choice name="Right/Left" value="3-true" />
      <choice name="Separate Windows" value="4-false" />
      <choice name="Hybrid Screen Top" value="5-false" />
      <choice name="Hybrid Screen Bottom" value="5-true" />
    </feature>
    <feature name="RENDERING RESOLUTION" submenu="GRAPHICS" value="azahar_resolution_factor" description="Enhancement. Increase the rendering resolution. Makes 3D objects clearer.">
      <choice name="1x (400x240)" value="1" />
      <choice name="2x (800x480)" value="2" />
      <choice name="3x (1200x720)" value="3" />
      <choice name="4x (1600x960)" value="4" />
      <choice name="5x (2000x1200)" value="5" />
      <choice name="6x (2400x1440)" value="6" />
      <choice name="7x (2800x1680)" value="7" />
      <choice name="8x (3200x1920)" value="8" />
      <choice name="9x (3600x2160)" value="9" />
      <choice name="10x (4000x2400)" value="10" />
    </feature>
    <feature name="GRAPHICS API" submenu="GRAPHICS" value="azahar_graphics_api" description="Choose which graphics API library to use.">
      <choice name="Software" value="0" />
      <choice name="OpenGL (Default)" value="1" />
      <choice name="Vulkan" value="2" />
    </feature>
    <feature name="HARDWARE SHADER" submenu="GRAPHICS" value="azahar_use_hw_shader" description="Helps some games to launch when disabled. May affect performance.">
      <choice name="Off" value="0" />
      <choice name="On" value="1" />
    </feature>
    <feature name="VSYNC" submenu="GRAPHICS" value="azahar_use_vsync_new" description="Fix screen tearing. CPU heavy.">
      <choice name="Off" value="0" />
      <choice name="On" value="1" />
    </feature>
    <feature name="FRAME LIMIT" submenu="GRAPHICS" value="azahar_use_frame_limit" description="Off will help some games, others will run too fast.">
      <choice name="Off" value="0" />
      <choice name="On" value="1" />
    </feature>
    <feature name="DISK SHADER CACHE" submenu="GRAPHICS" value="azahar_use_disk_shader_cache" description="Reduce stutter that happens when compiling shaders.">
      <choice name="Off" value="0" />
      <choice name="On" value="1" />
    </feature>
    <feature name="ENABLE ASYNC SHADER COMPILATION" submenu="GRAPHICS" value="azahar_async_shader_compilation" description="Compile shaders using background threads to avoid shader compilation stutter. May cause graphical glitches.">
      <choice name="Off" value="0" />
      <choice name="On" value="1" />
    </feature>
    <feature name="LOAD CUSTOM TEXTURES" submenu="GRAPHICS" value="azahar_custom_textures" description="Preloading is impossible from ES.">
      <choice name="Off" value="0" />
      <choice name="On" value="1-normal" />
      <choice name="Preload" value="1-preload" />
    </feature>
    <feature name="NEW 3DS MODE" group="ADVANCED OPTIONS" value="azahar_is_new_3ds" description="The New 3DS has a faster processor, ZL/ZR buttons and a C-stick.">
      <choice name="Off" value="0" />
      <choice name="On" value="1" />
    </feature>
  </emulator>
</features>
