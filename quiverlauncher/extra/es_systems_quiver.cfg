<?xml version="1.0"?>
<systemList>

  <system>
    <fullname>Quiver Launcher</fullname>
    <name>quiver</name>
    <manufacturer>Linux</manufacturer>
    <release>2026</release>
    <hardware>console</hardware>

    <!-- Quiver Launcher and one launcher per installed app -->
    <path>/userdata/roms/quiver</path>

    <!-- Use .sh extension for launchers -->
    <extension>.sh .SH</extension>

    <!-- Execute launchers with padtokey support -->
    <command>emulatorlauncher %CONTROLLERSCONFIG% -system quiver -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname quiver</command>

    <platform>pc</platform>
    <theme>linux</theme>

    <emulators>
      <emulator name="sh">
        <cores>
          <core default="true">sh</core>
        </cores>
      </emulator>
    </emulators>

  </system>

</systemList>
