<?xml version="1.0"?>
<systemList>

  <system>
    <fullname>lutris</fullname>
    <name>lutris</name>
    <manufacturer>Linux</manufacturer>
    <release>2024</release>
    <hardware>console</hardware>

    <!-- Lutris game launcher folder -->
    <path>/userdata/roms/lutris</path>

    <!-- Use .sh extension for launchers -->
    <extension>.sh .SH</extension>

    <!-- Execute launchers with padtokey support -->
    <command>emulatorlauncher %CONTROLLERSCONFIG% -system lutris -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname lutris</command>

    <platform>pc</platform>
    <theme>linux</theme>

    <emulators>
      <emulator name="sh">
        <cores>
          <core default="true">sh</core>
        </cores>
      </emulator>
    </emulators>

  </system>

</systemList>
