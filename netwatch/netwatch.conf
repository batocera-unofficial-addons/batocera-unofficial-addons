# netwatch settings, read by the service on start.
# Change them, then: /userdata/system/services/netwatch restart
#
# Useful options:
#   --overlay-scale 1.1            banner size (1.0 = 26px text at 1440p)
#   --overlay-style outline|solid  see-through outlined text, or a dark box
#   --overlay-duration 5           seconds on screen
#   --notify overlay|es|print      how to announce a new Sunshine stream
#   --web-port 8686                dashboard port (0 turns the dashboard off)
#   --web-bind 0.0.0.0             serve on every interface; use your tailnet IP
#                                  (100.x.y.z) to keep the dashboard off the LAN
#   --web-auth user:password       ask for a login before showing the dashboard
#   --subnet-router 192.168.1.5    a subnet router auto-detection misses
#   --show-gateway                 show your router's own DNS/UPnP traffic (hidden by default)
#
# The dashboard lists every device on your network that talks to this box.
# Don't expose its port to the internet. Options can't contain spaces.

NETWATCH_ARGS="--overlay-scale 1.1"

# Where netwatch writes its log. Leave empty for $NETWATCH_HOME/netwatch.log.
#   NETWATCH_LOG="/userdata/system/logs/netwatch.log"
NETWATCH_LOG="/userdata/system/logs/netwatch.log"

# Log rotation, done by netwatch while it runs. When the log reaches
# NETWATCH_LOG_MAX_BYTES it becomes netwatch.log.1, the old .1 becomes .2,
# and so on; anything past NETWATCH_LOG_KEEP is deleted. Worst-case disk use
# is about MAX_BYTES x (KEEP + 1).
#   NETWATCH_LOG_MAX_BYTES  size in bytes; 0 turns rotation off
#   NETWATCH_LOG_KEEP       how many rotated logs to keep; at least 1
NETWATCH_LOG_MAX_BYTES=1048576
NETWATCH_LOG_KEEP=1

# The service's own log: netwatch restarts, plus anything printed before
# netwatch's logging starts (like Python failing to launch). It stays small.
# Leave empty for netwatch-service.log in the same folder as NETWATCH_LOG.
NETWATCH_SERVICE_LOG=""