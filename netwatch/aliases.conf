# netwatch aliases: friendly names for devices, used on the dashboard and in
# the on-screen notification.
#
# Format, one alias per line:
#   <MAC or IP> = <name>
#
# Which key to use:
#   - Home network devices: use the MAC address. It stays the same when your
#     router hands the device a new IP, so the alias keeps working.
#   - Devices coming in over Tailscale or a subnet router: use the IP. Those
#     connections carry no MAC. A device's Tailscale IP (100.x.y.z) never
#     changes, so it works just as well.
#
# Rules:
#   - An alias beats every other name, including the device's Tailscale name.
#   - Upper and lower case don't matter, and spaces around "=" are ignored.
#   - Everything after a "#" is a comment, so names can't contain "#".
#   - netwatch rereads this file within 30 seconds of a change. No restart needed.
#
# Finding a device's MAC or IP: it's shown under the device's name on the
# dashboard. From a shell, `cat /proc/net/arp` lists MACs of home network devices.
#
# Examples (remove the leading "# " to use one):
#
# Home network devices, by MAC
# 3c:22:fb:91:0a:7e = Living room Shield
# b4:fb:e4:12:77:01 = Super Kool PC
#
# A home network device with a fixed IP
# 10.100.10.63 = Bedroom TV
# 192.168.2.69 = Jimmy Flip Phone
#
# Tailscale devices, by Tailscale IP (replaces the Tailscale name)
# 100.85.254.59 = Test PC