<?xml version="1.0"?>
<systemList>

  <system>
    <fullname>steam</fullname>
    <name>steam</name>
    <manufacturer>Linux</manufacturer>
    <release>2024</release>
    <hardware>console</hardware>

    <!-- Your Steam ROM folder -->
    <path>/userdata/roms/steam</path>

    <!-- Use .sh extension for launchers -->
    <extension>.sh .SH</extension>

    <!-- Execute launchers with padtokey support. Use -system steam so per-game
         settings (e.g. videomode) are loaded from steam["game.sh"], not ports. -->
    <command>emulatorlauncher %CONTROLLERSCONFIG% -system steam -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname steam</command>

    <platform>pc</platform>
    <theme>steam</theme>

    <!-- Use sh emulator to run .sh scripts (same as ports). Supports videomode. -->
    <emulators>
      <emulator name="sh">
        <cores>
          <core default="true">sh</core>
        </cores>
      </emulator>
    </emulators>

  </system>

</systemList>

