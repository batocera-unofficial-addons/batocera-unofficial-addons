name: Update apps JSON

on:
  push:
    branches: [main]
    paths:
      - "app/bua_installerx86.py"
      - "app/bua_installerarm64.py"
      - ".github/scripts/generate_apps_json.py"
      - ".github/workflows/update-apps-json.yml"
  workflow_dispatch: {}  # allow manual runs too

permissions:
  contents: write  # needed so the bot can push

# One run at a time, so two quick pushes can't race each other
concurrency:
  group: update-apps-json
  cancel-in-progress: false

jobs:
  update-apps-json:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Generate apps_x86.json and apps_arm64.json
        run: python .github/scripts/generate_apps_json.py

      - name: Commit and push if changed
        run: |
          if [ -z "$(git status --porcelain -- app/apps_x86.json app/apps_arm64.json)" ]; then
            echo "No changes to commit"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add app/apps_x86.json app/apps_arm64.json
          git commit -m "chore: update apps JSON [skip ci]"
          git pull --rebase
          git push
