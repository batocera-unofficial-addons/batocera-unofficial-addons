name: Contributors

# Add a SPONSORS_TOKEN secret (classic PAT with read:org and read:user) to also build sponsors.svg.

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: contributors
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .github/contribkit
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - run: npm install --ignore-scripts --no-audit --no-fund

      - run: npm run build
        env:
          CONTRIBKIT_GITHUB_CONTRIBUTORS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CONTRIBKIT_GITHUB_TOKEN: ${{ secrets.SPONSORS_TOKEN }}

      - name: Publish to contributors branch
        run: |
          cd dist
          rm -f .cache.json ./*.json
          git init -q -b contributors
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Update contributors"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" contributors
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
